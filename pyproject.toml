[project]
name = "flightagent"
version = "0.1.0"
description = "Autonomous flight-search agent (Nieuwegein-area -> India, 2027-07-17)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "tzdata>=2026a",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-PyYAML",
    "jsonschema",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightagent"]

[tool.ruff]
target-version = "py312"
line-length = 100
# spikes/ predates this config (Phase 0 de-risking scripts, master plan S534) and
# is not part of the src/flightagent module tree (master plan S3) this task governs.
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/flightagent"]
