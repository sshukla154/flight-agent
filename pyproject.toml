[project]
name = "flightagent"
version = "0.1.0"
description = "Autonomous flight-search agent (Nieuwegein-area -> India, 2027-07-17)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "typer>=0.27.1",
    "tzdata>=2026a",
    "uvicorn>=0.52.3",
]

[project.scripts]
flightagent = "flightagent.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-PyYAML",
    "jsonschema",
    "types-jsonschema",
    "httpx>=0.28.1",
    "pip-audit",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightagent"]

[tool.ruff]
target-version = "py312"
line-length = 100
# spikes/ predates this config (Phase 0 de-risking scripts, master plan S534) and
# is not part of the src/flightagent module tree (master plan S3) this task governs.
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system relies on `Depends(...)` as a
# parameter default -- B008 otherwise flags every route in api/routes_*.py
# for a pattern that is FastAPI's own documented usage, not a real
# mutable-default-argument bug.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/flightagent"]
branch = true
# scripts/check_coverage.py (Phase 8) looks up per-module entries in
# coverage.json's "files" dict by exact repo-relative path -- without this,
# keys can come back absolute (varies by OS/invocation dir) and the lookup
# would need brittle path-suffix guessing instead of an exact match.
relative_files = true
