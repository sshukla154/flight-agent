# config/airports.yaml — general airport reference data.
#
# Master plan §3 places this file under config/ as one of several catalogs
# (IATA -> name, city, country, IANA tz, lat/lon). This is deliberately a
# SEPARATE file from config/ground_access.yaml (master plan §6): this file
# is general reference data that would be identical no matter where the
# traveller starts from, while ground_access.yaml is specific to this
# project's home base (Nieuwegein, NL) and would differ entirely if the
# home base changed. Do not merge the two.
#
# All 18 airports this project ever searches: the 10 European origins near
# Nieuwegein (in DECISIONS.md/Addendum 2 priority order) followed by the 8
# Indian destinations (order matters less for destinations, but kept in
# the order already shown to the project owner). ground_access.yaml only
# has rows for the 10 origins — ground travel is only modelled at the
# European end, so the 8 destinations intentionally have no counterpart
# there.
#
# Coordinates are decimal degrees (WGS84), 4 decimal places. Recalled from
# training knowledge for the major/well-known airports (AMS, DUS, BRU,
# DEL, BOM, BLR, MAA); the smaller/less-common ones (EIN, RTM, NRN, CGN,
# CRL, MST, GRQ, HYD, CCU, LKO, VNS) were cross-checked with a web search
# against Wikipedia/aviation-reference sources on 2026-08-14 rather than
# stated from memory alone — see T8's task report for the per-airport
# source notes.

airports:
  # --- 10 European origins (priority order 1-10; see ground_access.yaml) ---
  - iata: AMS
    name: Amsterdam Airport Schiphol
    city: Amsterdam
    country: Netherlands
    iana_tz: Europe/Amsterdam
